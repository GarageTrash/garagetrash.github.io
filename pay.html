<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pay Garage Trash Records for records and merch with Venmo or Cash App.">
  <meta name="theme-color" content="#9cff00">
  <title>Pay | Garage Trash Records</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Garage Trash Records home">
      <span>Garage Trash</span>
      <small>Records</small>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Main</a>
      <a href="about.html">About</a>
      <a href="merch.html">Merch</a>
      <a href="pay.html" aria-current="page">Pay</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main id="main-content" class="payment-main">
    <header class="payment-hero">
      <h1>Pay at<br>the table.</h1>
      <p>Confirm the total before paying. The recipient should be Garage Trash. Show the completed transaction at the table.</p>
    </header>

    <section class="payment-options" aria-label="Payment options">
      <div class="payment-list">
        <a class="payment-option" href="https://account.venmo.com/u/garagetrashprods" target="_blank" rel="noopener">
          <span class="payment-mark" aria-hidden="true">V</span>
          <span class="payment-name">Venmo<small>@garagetrashprods</small></span>
          <span class="payment-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="payment-option" href="https://cash.app/$garagetrashprd" target="_blank" rel="noopener">
          <span class="payment-mark" aria-hidden="true">$</span>
          <span class="payment-name">Cash App<small>$garagetrashprd</small></span>
          <span class="payment-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Garage Trash Records <span aria-hidden="true">©</span> 2026</p>
  </footer>
</body>
</html>
